<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <title>AI Infographic Studio</title>
    <meta
      name="description"
      content="Turn any topic into a clear, professional infographic. Minimal, corporate or colorful styles in 1:1, 3:4 and 9:16, generated with Z-Image on your own Kie.ai key."
    />
    <link rel="icon" type="image/png" href="/branding/favicon-32.png" />
    <link rel="apple-touch-icon" href="/branding/favicon.png" />

    <!-- Link previews. %SITE_URL% becomes VITE_SITE_URL at build time (see vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Infographic Studio" />
    <meta property="og:title" content="AI Infographic Studio" />
    <meta
      property="og:description"
      content="Turn any topic into a clear, professional infographic, generated on your own Kie.ai key."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/branding/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AI Infographic Studio: turn any topic into a clear, professional infographic" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Infographic Studio" />
    <meta
      name="twitter:description"
      content="Turn any topic into a clear, professional infographic, generated on your own Kie.ai key."
    />
    <meta name="twitter:image" content="%SITE_URL%/branding/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
